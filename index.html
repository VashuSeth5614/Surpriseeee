<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Surprise 🎁</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- STAGE 1 -->
    <section id="stage1" class="stage active">
        <div class="card">
            <div class="gift">🎁</div>

            <h1>Tap to Open</h1>

            <p>There's something waiting for you...</p>

            <button id="openBtn">OPEN THE GIFT</button>
        </div>
    </section>


    <!-- STAGE 2 -->
    <section id="stage2" class="stage">
        <div class="card">

            <h1>Stage 1 🧩</h1>
            <p>Put every piece in its correct place.</p>

            <div id="pieces">

                <div class="piece" draggable="true" data-piece="star">
                    ⭐
                </div>

                <div class="piece" draggable="true" data-piece="heart">
                    ❤️
                </div>

                <div class="piece" draggable="true" data-piece="gift">
                    🎁
                </div>

            </div>

            <div id="slots">

                <div class="slot" data-slot="star">
                    ⭐
                </div>

                <div class="slot" data-slot="heart">
                    ❤️
                </div>

                <div class="slot" data-slot="gift">
                    🎁
                </div>

            </div>

            <p id="pieceStatus">0 / 3 completed</p>

        </div>
    </section>


    <!-- STAGE 3 -->
    <section id="stage3" class="stage">
        <div class="card">

            <h1>Stage 2 🔴🟢</h1>

            <p>
                Red ball × 3<br>
                Green ball × 2
            </p>

            <div class="balls">

                <div class="ballContainer">

                    <div id="redBall" class="ball red"></div>

                    <span
